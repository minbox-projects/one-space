[package]
name = "OneSpace"
version = "0.1.32"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "onespace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["macos-private-api", "tray-icon", "test"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-shell = "2.3.5"
ssh_cfg = "0.3.0"
dirs = "6.0.0"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-updater = "=2.3.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-autostart = "2"
tauri-plugin-oauth = "2.0.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks", "stream"] }
tauri-plugin-opener = "2.5.3"
toml_edit = "0.25.3"
regex = "1.12.3"
quick-xml = "0.38.4"
hostname = "0.4.2"
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
tokio = { version = "1", features = ["time", "process", "io-util", "sync", "macros", "rt-multi-thread", "net", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
refinery = { version = "=0.8.16", features = ["rusqlite"] }
refinery-core = "=0.8.16"
url = "2.5"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
futures-util = "0.3"
if-addrs = "0.15.0"
tokio-util = { version = "0.7.19", features = ["io-util", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSNotification", "NSOperation", "NSString", "block2"] }
