name: "publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin' # Intel 芯片
            description: 'macOS Intel'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin' # Apple M 芯片
            description: 'macOS Silicon'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc' # Windows x64
            description: 'Windows x64'

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.description }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: check macOS signing secrets
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Fail before any build or upload when the signing material is absent,
          # so a missing secret can never quietly produce an unsigned release.
          missing=""
          [ -n "$APPLE_CERTIFICATE" ] || missing="$missing APPLE_CERTIFICATE"
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ -n "$APPLE_SIGNING_IDENTITY" ] || missing="$missing APPLE_SIGNING_IDENTITY"
          if [ -n "$missing" ]; then
            for secret_name in $missing; do
              echo "::error::Missing required signing secret: $secret_name"
            done
            echo "Refusing to build a macOS release without signing material." >&2
            exit 1
          fi
          echo "All required macOS signing secrets are present."

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libnm-dev libsoup2.4-dev

      - name: install frontend dependencies
        run: npm ci

      - name: build frontend
        run: npm run build

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          # 获取当前触发发版的标签
          CURRENT_TAG=${{ github.ref_name }}
          # 获取上一个标签，如果不存在则为空
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")
          
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "## 更新内容 / What's Changed" >> $GITHUB_OUTPUT
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found. Getting all commits."
            git log --pretty=format:"- %s (%h)" $CURRENT_TAG >> $GITHUB_OUTPUT
          else
            echo "Generating changelog between $PREVIOUS_TAG and $CURRENT_TAG"
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..$CURRENT_TAG >> $GITHUB_OUTPUT
          fi
          
          echo "" >> $GITHUB_OUTPUT
          echo "> Generated by GitHub Actions" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: import macOS signing certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Import the self-signed certificate into a per-run keychain and make it
          # usable by codesign. Tauri's own certificate import is deliberately not
          # used: it only recognises Apple-prefixed certificate names, which a
          # self-signed certificate is not.
          KEYCHAIN_PATH="$RUNNER_TEMP/onespace-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT_PATH="$RUNNER_TEMP/onespace-signing.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')

          if ! security find-identity -p codesigning "$KEYCHAIN_PATH" | grep -q "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::Signing identity '$APPLE_SIGNING_IDENTITY' was not found in the imported keychain"
            security find-identity -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          rm -f "$CERT_PATH"
          echo "Imported signing identity '$APPLE_SIGNING_IDENTITY' for codesign."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_DEBUG: true
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OneSpace ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}

      - name: verify signed macOS release artifact
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          # Tripwire: reject an unsigned or ad-hoc artifact before it is trusted.
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          if [ ! -d "$bundle_dir" ]; then
            bundle_dir="$(find src-tauri/target -type d -name macos -path '*/release/bundle/*' 2>/dev/null | head -n 1)"
          fi
          if [ -z "$bundle_dir" ] || [ ! -d "$bundle_dir" ]; then
            echo "::error::Could not locate the macOS bundle directory under src-tauri/target"
            exit 1
          fi
          app_path="$(find "$bundle_dir" -maxdepth 1 -name '*.app' -type d 2>/dev/null | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "::error::Could not locate the built OneSpace.app in $bundle_dir"
            exit 1
          fi
          bash skills/onespace-release/scripts/verify_release_artifact.sh "$app_path"
